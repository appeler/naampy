[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "naampy"
source-exclude = [".DS_Store", "Thumbs.db"]
source-include = [
    "CHANGELOG.md",
    "Citation.cff",
    "MODEL_CARD.md",
    "model_training/DATA.md",
    "model_training/__init__.py",
    "model_training/evaluate_gender_model.py",
    "model_training/evaluation.py",
    "model_training/export_lookup_table.py",
    "model_training/export_training_data.py",
    "model_training/reports/*.json",
    "model_training/retransliterate_native.py",
    "model_training/train_gender_ngram.py",
    "model_training/train_gender_lstm.py",
]

[project]
name = "naampy"
version = "0.11.0"
description = "Estimate population-level patterns in Indian first names"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Gaurav Sood", email = "gsood07@gmail.com" },
  { name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com" },
  { name = "Rajashekar Chintalapati", email = "rajshekar.ch@gmail.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities"
]
keywords = ["first-names", "india", "name-patterns"]
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.21.0",
  "pandas>=2.0.0",
  "huggingface-hub>=1.27.0",
  "pyarrow>=16",
  "safetensors>=0.8.0",
]
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pre-commit>=4",
    "pydoclint>=0.9.1",
    "pandas-stubs>=2.0",
    { include-group = "test" },
]
test = ["pytest>=8", "pytest-cov>=6"]
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
training = [
    "scikit-learn>=1.8",
    "scipy>=1.17",
]

[project.urls]
Homepage = "https://github.com/appeler/naampy"
Documentation = "https://appeler.github.io/naampy/"
Repository = "https://github.com/appeler/naampy"
Issues = "https://github.com/appeler/naampy/issues"
Changelog = "https://github.com/appeler/naampy/blob/master/CHANGELOG.md"

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    "docs",
    "src/naampy/data",
    "*.ipynb",
]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "B008", "C901", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF", "PT", "S110"]
"docs/**" = ["D"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not live",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: reaches Hugging Face and is deselected by default",
]
filterwarnings = ["error"]

# Coverage configuration (optional)
# To run with coverage: pytest --cov=naampy --cov-report=term-missing --cov-report=html

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'"
]

[tool.coverage.run]
source = ["src"]
branch = true


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.deptry]
per_rule_ignores = {DEP002 = ["sphinx", "furo", "sphinx-copybutton", "myst-parser"]}
extend_exclude = ["model_training", ".*\\.ipynb$"]

# pydoclint configuration
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pyright]
include = [
    "src",
    "model_training/evaluate_gender_model.py",
    "model_training/evaluation.py",
    "model_training/export_lookup_table.py",
    "model_training/export_training_data.py",
    "model_training/train_gender_ngram.py",
    "model_training/train_gender_lstm.py",
]
typeCheckingMode = "standard"
