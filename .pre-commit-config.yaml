repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^naampy/model/  # the bundled gender BiLSTM weights ship in the wheel
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

# Type checking (pyright) and docstring linting (pydoclint) run in CI's lint
# job against the full dependency set instead of here: both need naampy's
# runtime deps installed to resolve types/signatures correctly, which is slow
# to replicate in a per-file pre-commit hook sandbox. See .github/workflows/ci.yml.
